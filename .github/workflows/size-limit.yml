name: "size"
on:
  pull_request:
    branches:
      - main
      - release-*
      - pr/*
jobs:
  size:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.x"
      - run: npm ci
      - name: Run size-limit
        uses: andresz1/size-limit-action@v1.6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
