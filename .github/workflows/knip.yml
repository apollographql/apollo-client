name: Look for dead code and unused dependencies

on: push

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Ubuntu/Node v24
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.4.0
        with:
          node-version: "24.x"
      - run: npm ci
      - name: Run knip
        run: npm run knip
